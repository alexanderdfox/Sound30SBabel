<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 30-Second Sound Library of Babel</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #181c24;
            --accent-color: #00ffcc;
            --text-main: #e1e7ed;
            --text-muted: #8a99ad;
            --border-color: #2a3444;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
        }

        p.description {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        button:disabled {
            border-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            background-color: transparent;
        }

        #status {
            margin-top: 20px;
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-muted);
            min-height: 20px;
        }

        .stats {
            margin-top: 30px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sound Library of Babel</h1>
        <p class="description">
            Every possible 30-second combination of digital audio data exists within this mathematical space. Enter a coordinate string or seed to extract its audio track.
        </p>

        <div class="control-group">
            <label for="seedInput">Library Coordinate / Seed</label>
            <input type="text" id="seedInput" value="symphony_in_c_minor_441" placeholder="Type any text or number...">
        </div>

        <div class="button-row">
            <button id="playBtn" onclick="playBabelTrack()">Play 30s Track</button>
            <button id="stopBtn" onclick="stopAudio()" dg-disabled disabled>Stop</button>
            <button onclick="randomizeSeed()">Randomize</button>
        </div>

        <div id="status">Status: Ready</div>

        <div class="stats">
            <span>Duration: 30.0s</span>
            <span>Sample Rate: 8kHz (Pseudo-Babel)</span>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let currentSource = null;
        let isPlaying = false;

        // Use Math.abs on the hash to prevent negative values from breaking math logic
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0; 
            }
            return Math.abs(hash);
        }

        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function randomizeSeed() {
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789_";
            let result = "";
            for (let i = 0; i < 16; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById("seedInput").value = result;
        }

        function playBabelTrack() {
            if (isPlaying) stopAudio();

            const seedText = document.getElementById("seedInput").value || "default";
            const seedNum = hashCode(seedText);
            const rng = mulberry32(seedNum);

            document.getElementById("status").innerText = "Status: Synthesizing 30-second coordinate block...";
            document.getElementById("playBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const sampleRate = 8000; 
            const durationSeconds = 30;
            const totalSamples = sampleRate * durationSeconds;
            
            const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
            const channelData = buffer.getChannelData(0);

            let waveState = 0;
            // Safe modulation frequency derived from positive seedNum
            const modFreqDivisor = 200 + (seedNum % 500);

            for (let i = 0; i < totalSamples; i++) {
                let rawRandom = (rng() * 2) - 1;
                waveState = waveState * 0.95 + rawRandom * 0.05; 
                
                let modulation = Math.sin(i / modFreqDivisor);
                // Ensure healthy output range without zeroing out
                channelData[i] = (waveState * 0.7) + (modulation * rawRandom * 0.3);
            }

            // Create a GainNode to boost and control overall output volume safely
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.8; // Set master volume to 80%

            currentSource = audioCtx.createBufferSource();
            currentSource.buffer = buffer;
            
            // Connect source through gain node to speakers
            currentSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            currentSource.onended = () => {
                stopAudio();
                document.getElementById("status").innerText = "Status: Track finished playback.";
            };

            currentSource.start();
            isPlaying = true;
            document.getElementById("status").innerText = "Status: Playing coordinate stream [" + seedText + "]";
        }

        function stopAudio() {
            if (currentSource) {
                try {
                    currentSource.stop();
                } catch (e) {}
                currentSource.disconnect();
                currentSource = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
            }
            isPlaying = false;
            document.getElementById("playBtn").disabled = false;
            document.getElementById("stopBtn").disabled = true;
            document.getElementById("status").innerText = "Status: Ready";
        }
    </script>
</body>
</html>
